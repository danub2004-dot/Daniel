<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000">
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="lib.js"></script><script>
const V=VAD; let s=`<defs>${V.defs()}</defs><rect width="1080" height="1920" fill="#1c222d"/>
<radialGradient id="bgl" cx="20%" cy="10%" r="90%"><stop offset="0" stop-color="#5a4a3a"/><stop offset="1" stop-color="#151a24"/></radialGradient>
<rect width="1080" height="1920" fill="url(#bgl)" opacity="0.7"/>
<text x="540" y="92" text-anchor="middle" font-family="JetBrains Mono" font-weight="800" font-size="54" fill="#e8dcc8">ВАДУЛЕКА</text>
<text x="540" y="140" text-anchor="middle" font-family="JetBrains Mono" font-size="26" fill="#9aa6b8">лист персонажей · серия 1</text>`;
const keys=['ya','yura','andrei','virel'], cols=['#5cff7a','#ffd84a','#7ac8ff','#ff8a6a'];
keys.forEach((k,i)=>{const cx=(i%2)*540, cy=180+Math.floor(i/2)*870;
 s+=`<g transform="translate(${cx+20},${cy})"><rect width="500" height="840" rx="4" fill="#0e1218" opacity="0.5"/>
 <g transform="translate(0,20) scale(1.25)"><clipPath id="cell${i}"><rect x="-20" y="-20" width="440" height="604"/></clipPath><g clip-path="url(#cell${i})">${V.character(k)}</g></g>
 <rect x="20" y="752" width="460" height="70" fill="#0a0d0f" opacity="0.8"/><rect x="20" y="752" width="460" height="70" fill="none" stroke="${cols[i]}" stroke-width="3"/>
 <text x="40" y="784" font-family="JetBrains Mono" font-weight="800" font-size="28" fill="${cols[i]}">${V.CH[k].name}</text>
 <text x="40" y="812" font-family="JetBrains Mono" font-size="21" fill="#e8eee8">${V.CH[k].nick}</text></g>`;});
s+=V.overlay(); document.getElementById('s').innerHTML=s;
</script>
