<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f0d">
<title>LEO Barbershop — Programare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f0d; --bg2:#0f1512; --card:#141b17; --card2:#18211c; --line:#233029; --line2:#2e3d35;
  --text:#eef3f0; --muted:#8fa197; --dim:#5d6e65;
  --green:#2f8f5b; --green2:#3fb574; --glow:rgba(63,181,116,.35); --gold:#f2c14e; --danger:#ff6b6b;
  --r:20px; --r-sm:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 500px at 100% -10%,rgba(47,143,91,.22),transparent 60%),
    radial-gradient(600px 400px at -10% 30%,rgba(47,143,91,.10),transparent 60%),
    linear-gradient(transparent 0 0);
}
.bgfx:after{content:"";position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:56px 56px;mask-image:linear-gradient(#000,transparent 70%)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(130px + var(--safe-b))}

/* Top bar */
.top{position:sticky;top:0;z-index:20;margin:0 -16px;padding:12px 16px;display:flex;align-items:center;gap:12px;
  background:rgba(11,15,13,.72);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-color:var(--line)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);transition:.2s}
.iconbtn:active{transform:scale(.94)}
.iconbtn[hidden]{display:none}
.brand{display:flex;flex-direction:column;line-height:1}
.logo{font-family:Unbounded,sans-serif;font-weight:900;font-style:italic;font-size:22px;letter-spacing:.02em;transform:skewX(-8deg)}
.logo sub{display:block;font-family:Manrope;font-style:normal;font-weight:800;font-size:7.5px;letter-spacing:.42em;margin-top:3px;transform:skewX(8deg);color:var(--muted)}
.spacer{flex:1}
.lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.lang button{padding:7px 11px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);transition:.2s}
.lang button.on{background:var(--text);color:var(--bg)}

/* Progress */
.steps{display:flex;gap:6px;margin:14px 0 4px}
.steps i{display:block;flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.steps i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--green),var(--green2));transform:translateX(-101%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.steps i.fill:after{transform:none}
.stepmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* Hero (step 0 header) */
.hero{margin:18px 0 6px;padding:20px;border-radius:var(--r);position:relative;overflow:hidden;
  background:linear-gradient(145deg,#13231b,#0e1512 60%);border:1px solid var(--line)}
.hero:before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,var(--glow),transparent 70%)}
.hero:after{content:"";position:absolute;left:-20%;bottom:28px;width:140%;height:1px;background:linear-gradient(90deg,transparent,var(--green2),transparent);transform:rotate(-14deg);opacity:.5}
.hero .row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600;position:relative;z-index:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green2);box-shadow:0 0 0 4px rgba(63,181,116,.18);animation:pulse 2s infinite}
.dot.off{background:var(--dim);box-shadow:none;animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(63,181,116,0)}}
.hero h1{font-family:Unbounded;font-weight:800;font-size:26px;line-height:1.1;margin:12px 0 8px;letter-spacing:-.01em;position:relative;z-index:1}
.hero h1 em{font-style:normal;color:var(--green2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative;z-index:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line2);font-size:12.5px;font-weight:600;color:var(--text);text-decoration:none}
.chip svg{flex:none}

h2.title{font-family:Unbounded;font-weight:800;font-size:22px;margin:22px 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 16px;color:var(--muted);font-size:14.5px}

/* Screens */
.screen{display:none;animation:in .35s cubic-bezier(.2,.8,.2,1)}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}}

/* Barber cards */
.list{display:grid;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);transition:border-color .2s,background .2s,transform .15s}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--green2);background:linear-gradient(135deg,rgba(47,143,91,.16),var(--card) 70%)}
.ava{flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-family:Unbounded;font-weight:800;font-size:18px;position:relative;
  background:linear-gradient(145deg,#2a3b32,#18211c);border:1px solid var(--line2)}
.ava.any{background:linear-gradient(145deg,var(--green),#1d5a3a)}
.ava .on{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:var(--green2);border:3px solid var(--card)}
.opt .info{flex:1;min-width:0}
.opt .name{font-weight:800;font-size:16.5px}
.badge{display:inline-block;margin-top:4px;font-size:10.5px;font-weight:800;letter-spacing:.12em;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--muted)}
.badge.lead{background:rgba(242,193,78,.12);color:var(--gold)}
.meta{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12.5px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.stars{color:var(--gold);letter-spacing:1px}
.next{color:var(--green2)}
.radio{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;transition:.2s}
.sel .radio{border-color:var(--green2);background:var(--green2)}
.sel .radio:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--bg)}
.check{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--line2);display:grid;place-items:center;transition:.2s}
.sel .check{border-color:var(--green2);background:var(--green2)}
.check svg{opacity:0;transform:scale(.5);transition:.2s}
.sel .check svg{opacity:1;transform:none}

/* Service tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--muted);transition:.2s}
.tab.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.group h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:20px 4px 10px;font-weight:800}
.svc{align-items:flex-start}
.svc .name{font-size:15.5px;line-height:1.3}
.svc .desc{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
.svc .foot{display:flex;align-items:center;gap:10px;margin-top:10px}
.price{font-weight:800;font-size:16px}
.dur{font-size:12px;font-weight:700;color:var(--muted);padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.05)}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.08em;padding:3px 7px;border-radius:6px;background:rgba(63,181,116,.15);color:var(--green2);text-transform:uppercase}
.hint{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);background:rgba(63,181,116,.08);border:1px solid rgba(63,181,116,.25);font-size:13px;color:#cfe9da;margin-bottom:12px}

/* Dates */
.days{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;scroll-snap-align:start;width:62px;padding:10px 0 12px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;transition:.2s;position:relative}
.day .dw{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day .dn{font-family:Unbounded;font-weight:800;font-size:20px}
.day .dm{font-size:11px;color:var(--dim);font-weight:700}
.day.sel{background:var(--green);border-color:var(--green2);box-shadow:0 8px 24px -8px var(--glow)}
.day.sel .dw,.day.sel .dm{color:#d9f3e4}
.day[disabled]{opacity:.35;cursor:not-allowed}
.day[disabled] .dn{text-decoration:line-through;text-decoration-thickness:2px}
.day .cnt{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--green2)}
.day.sel .cnt{background:#fff}
.monthlbl{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px;font-weight:800;font-size:15px;text-transform:capitalize}
.monthlbl small{color:var(--muted);font-weight:600;font-size:12.5px;text-transform:none}
.slots h4{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:700;margin:18px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{padding:12px 0;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:14.5px;transition:.15s;font-variant-numeric:tabular-nums}
.slot:active{transform:scale(.95)}
.slot.sel{background:var(--text);color:var(--bg);border-color:var(--text)}
.empty{text-align:center;padding:34px 18px;border-radius:var(--r);background:var(--card);border:1px dashed var(--line2);margin-top:14px}
.empty b{display:block;font-size:16px;margin:10px 0 4px}
.empty p{color:var(--muted);margin:0 0 14px;font-size:14px}
.ghost{padding:11px 16px;border-radius:12px;border:1px solid var(--line2);font-weight:700;font-size:14px;background:var(--card2)}

/* Form */
.summary{border-radius:var(--r);background:var(--card);border:1px solid var(--line);overflow:hidden}
.summary .r{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.summary .r:last-child{border:0}
.summary .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;border:1px solid var(--line)}
.summary .k{font-size:12px;color:var(--muted);font-weight:600}
.summary .v{font-weight:800;font-size:15px}
.summary .edit{margin-left:auto;font-size:13px;color:var(--green2);font-weight:700;padding:6px}
.summary .lines{padding:6px 16px 12px;border-bottom:1px solid var(--line)}
.summary .ln{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;color:#cdd8d2}
.summary .tot{display:flex;justify-content:space-between;padding:14px 16px;font-weight:800;font-size:18px;background:rgba(63,181,116,.06)}
.field{margin-top:14px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 7px 2px}
.field label i{color:var(--green2);font-style:normal}
.inp{width:100%;padding:15px 16px;border-radius:var(--r-sm);background:var(--card);border:1.5px solid var(--line);outline:none;font-size:16px;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--green2);box-shadow:0 0 0 4px rgba(63,181,116,.15)}
.inp.err{border-color:var(--danger)}
.phone{display:flex;align-items:stretch}
.phone span{display:flex;white-space:nowrap;align-items:center;padding:0 12px 0 16px;border-radius:var(--r-sm) 0 0 var(--r-sm);background:var(--card2);border:1.5px solid var(--line);border-right:0;font-weight:700;color:var(--muted)}
.phone .inp{border-radius:0 var(--r-sm) var(--r-sm) 0}
.errmsg{color:var(--danger);font-size:12.5px;margin:6px 2px 0;font-weight:600;display:none}
.err+.errmsg,.phone.err .errmsg,.consent.err .errmsg{display:block}
textarea.inp{resize:none;min-height:80px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:var(--r-sm)}
.seg button{padding:10px 4px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.consent{display:flex;gap:12px;align-items:flex-start;margin-top:18px;font-size:13.5px;color:var(--muted);line-height:1.5;cursor:pointer}
.consent input{position:absolute;opacity:0;pointer-events:none}
.consent .check{margin-top:1px}
.consent.sel .check{border-color:var(--green2);background:var(--green2)}
.consent.sel .check svg{opacity:1;transform:none}
.consent.err .check{border-color:var(--danger)}
.consent a{color:var(--text)}
.note{display:flex;gap:10px;margin-top:16px;padding:14px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.5}

/* Bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + var(--safe-b));
  background:linear-gradient(transparent,rgba(11,15,13,.9) 24%,var(--bg));pointer-events:none}
.bar .in{max-width:528px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;border-radius:22px;
  background:rgba(22,30,26,.92);border:1px solid var(--line2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:auto;
  box-shadow:0 18px 40px -12px rgba(0,0,0,.6)}
.bar .sum{flex:1;min-width:0}
.bar .sum b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.bar .sum small{display:block;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cta{flex:none;display:inline-flex;align-items:center;gap:8px;padding:15px 20px;border-radius:16px;font-weight:800;font-size:15px;
  background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;box-shadow:0 10px 24px -8px var(--glow);transition:.2s}
.cta:active{transform:scale(.96)}
.cta[disabled]{background:var(--card2);color:var(--dim);box-shadow:none;cursor:not-allowed}
.cta.busy{pointer-events:none}
.cta .sp{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Success */
.done{text-align:center;padding-top:26px}
.okring{width:96px;height:96px;margin:10px auto 18px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(63,181,116,.35),transparent 70%)}
.okring div{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--green2),var(--green));display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.okring path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .4s .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done h2{font-family:Unbounded;font-size:24px;margin:0 0 8px}
.done p{color:var(--muted);margin:0 auto 20px;max-width:340px}
.ticket{text-align:left;position:relative}
.code{font-family:Unbounded;letter-spacing:.12em;font-size:13px;color:var(--green2)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.act{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--text);text-decoration:none}
.act.full{grid-column:1/-1}
.toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-20px);opacity:0;z-index:50;padding:11px 16px;border-radius:12px;background:var(--text);color:var(--bg);font-weight:700;font-size:14px;transition:.3s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:600px){.hero h1{font-size:30px}.grid{grid-template-columns:repeat(5,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bgfx"></div>
<div class="wrap">
  <header class="top" id="top">
    <button class="iconbtn" id="back" hidden aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="brand"><div class="logo">LEO<sub>BARBERSHOP</sub></div></div>
    <div class="spacer"></div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="ro">RO</button><button data-lang="ru">RU</button>
    </div>
  </header>

  <div id="progress">
    <div class="steps"><i></i><i></i><i></i><i></i></div>
    <div class="stepmeta"><span id="stepName"></span><span id="stepNum"></span></div>
  </div>

  <!-- STEP 1: barber -->
  <section class="screen" data-step="0">
    <div class="hero">
      <div class="row"><span class="dot" id="openDot"></span><span id="openTxt"></span></div>
      <h1 data-i="heroTitle"></h1>
      <div class="row" data-i="heroSub" style="font-weight:500;font-size:14px"></div>
      <div class="chips">
        <a class="chip" href="https://maps.google.com/?q=Strada+Calea+Ie%C8%99ilor+6D+Chi%C8%99in%C4%83u" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          Calea Ieșilor 6D</a>
        <span class="chip"><span class="stars">★</span> 5.0 · <span id="totalReviews"></span></span>
        <span class="chip" data-i="hours"></span>
      </div>
    </div>
    <h2 class="title" data-i="s1Title"></h2>
    <p class="sub" data-i="s1Sub"></p>
    <div class="list" id="barbers"></div>
  </section>

  <!-- STEP 2: services -->
  <section class="screen" data-step="1">
    <h2 class="title" data-i="s2Title"></h2>
    <p class="sub" data-i="s2Sub"></p>
    <div class="tabs" id="tabs"></div>
    <div id="comboHint"></div>
    <div id="services"></div>
  </section>

  <!-- STEP 3: date/time -->
  <section class="screen" data-step="2">
    <h2 class="title" data-i="s3Title"></h2>
    <p class="sub" id="s3Sub"></p>
    <div class="monthlbl"><span id="monthName"></span><small id="durLbl"></small></div>
    <div class="days" id="days"></div>
    <div class="slots" id="slots"></div>
  </section>

  <!-- STEP 4: details -->
  <section class="screen" data-step="3">
    <h2 class="title" data-i="s4Title"></h2>
    <p class="sub" data-i="s4Sub"></p>
    <div class="summary" id="summary"></div>
    <form id="form" novalidate autocomplete="on">
      <div class="field">
        <label for="fName"><span data-i="fName"></span> <i>*</i></label>
        <input class="inp" id="fName" name="name" autocomplete="given-name" required>
        <div class="errmsg" data-i="eName"></div>
      </div>
      <div class="field">
        <label for="fPhone"><span data-i="fPhone"></span> <i>*</i></label>
        <div class="phone" id="phoneWrap">
          <span>🇲🇩 +373</span>
          <input class="inp" id="fPhone" name="tel" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="6XX XX XXX">
        </div>
        <div class="errmsg" data-i="ePhone" id="ePhone"></div>
      </div>

const pad = n=>String(n).padStart(2,"0");
const fmtT = m=>pad(Math.floor(m/60))+":"+pad(m%60);
const dkey = d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0)/4294967295}

/* Demo availability: deterministic "busy" slots per barber/day. Replace with an API call. */
function freeSlots(barberId, day, dur){
  const b = BARBERS.find(x=>x.id===barberId);
  if(b.off.includes(day.getDay())) return [];
  const now = new Date(), isToday = dkey(day)===dkey(now);
  const nowMin = now.getHours()*60+now.getMinutes()+30;
  const out=[];
  for(let m=SHOP.open*60; m+dur<=SHOP.close*60; m+=SHOP.step){
    if(isToday && m<nowMin) continue;
    let ok=true;
    for(let x=m;x<m+dur;x+=SHOP.step) if(hash(barberId+dkey(day)+x)<0.18){ok=false;break}
    if(ok) out.push(m);
  }
  return out;
}
function slotsFor(day){
  const dur = Math.max(totalMin(),30);
  if(S.barber && S.barber!=="any") return freeSlots(S.barber,day,dur).map(m=>({m,b:S.barber}));
  const map=new Map();
  for(const b of BARBERS) for(const m of freeSlots(b.id,day,dur)) if(!map.has(m)) map.set(m,b.id);
  return [...map].sort((a,b)=>a[0]-b[0]).map(([m,b])=>({m,b}));
}
function daysList(n=21){const a=[],d=new Date();d.setHours(0,0,0,0);for(let i=0;i<n;i++){a.push(new Date(d));d.setDate(d.getDate()+1)}return a}
function nextFree(barberId){
  for(const d of daysList(14)){const s=freeSlots(barberId,d,45);if(s.length)return relDay(d)+" "+fmtT(s[0])}
  return "—";
}

  $("#days").innerHTML = days.map(d=>{
    const k=dkey(d), n=slotsFor(d).length;

  const sel = days.find(d=>dkey(d)===S.date);
  $("#monthName").textContent = (L.monthsNom||L.months)[sel.getMonth()]+" "+sel.getFullYear();
  const slots = slotsFor(sel);
  if(!slots.length){
    const nx = days.find(d=>slotsFor(d).length);
    $("#slots").innerHTML = `<div class="empty"><div style="font-size:28px">🗓️</div><b>${t("noSlots")}</b><p>${nx?t("noSlotsSub",{d:fmtDay(nx)}):""}</p>${nx?`<button class="ghost" data-go="${dkey(nx)}">${t("goNearest")} →</button>`:""}</div>`;

  const parts=[["morning","☀️",0,12*60],["afternoon","🌤️",12*60,17*60],["evening","🌙",17*60,24*60]];
  $("#slots").innerHTML = parts.map(([k,ic,a,b])=>{
    const ss=slots.filter(s=>s.m>=a&&s.m<b);
    return ss.length?`<h4>${ic} ${t(k)} <span style="color:var(--dim)">· ${ss.length}</span></h4><div class="grid">${ss.map(s=>`<button class="slot ${S.time===s.m?"sel":""}" data-t="${s.m}" data-b="${s.b}">${fmtT(s.m)}</button>`).join("")}</div>`:"";
  }).join("");
  setTimeout(()=>{$(".day.sel")?.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})},30);
}

function barberLabel(){
  if(S.barber==="any"){const b=BARBERS.find(x=>x.id===S.assigned);return b?t("anyAssigned",{b:b.name}):t("any")}
  return BARBERS.find(b=>b.id===S.barber)?.name||"";
}
function whenLabel(){const d=new Date(S.date+"T00:00");return fmtDay(d)+" · "+fmtT(S.time)+" – "+fmtT(S.time+totalMin())}
function summaryHTML(editable){
  const ic1=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>`;
  const ic2=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`;
  return `
    <div class="r"><span class="ic">${ic1}</span><div><div class="k">${t("kBarber")}</div><div class="v">${barberLabel()}</div></div>${editable?`<button class="edit" data-jump="0">${t("edit")}</button>`:""}</div>
    <div class="r"><span class="ic">${ic2}</span><div><div class="k">${t("kWhen")}</div><div class="v">${whenLabel()}</div></div>${editable?`<button class="edit" data-jump="2">${t("edit")}</button>`:""}</div>
    <div class="lines">${selSvcs().map(s=>`<div class="ln"><span>${svcName(s)} <span style="color:var(--dim)">· ${fmtDur(s.min)}</span></span><b>${s.priceTo?s.price+"–"+s.priceTo:s.price} L</b></div>`).join("")}
      ${editable?`<button class="edit" data-jump="1" style="padding:6px 0">+ ${t("edit")}</button>`:""}</div>
    <div class="tot"><span>${t("total")}</span><span>${priceStr(totalPrice())}</span></div>`;
}
function renderDetails(){
  $("#summary").innerHTML = summaryHTML(true);
  $("#reminder").innerHTML = T[S.lang].rem.map((r,i)=>`<button type="button" class="${S.reminder===i?"on":""}" data-r="${i}">${r}</button>`).join("");
}

function renderBar(){
  const L=T[S.lang], st=S.step;
  $("#bar").style.display = st===4?"none":"";
  $("#progress").style.display = st===4?"none":"";
  $("#back").hidden = st===0||st===4;
  $$(".steps i").forEach((el,i)=>el.classList.toggle("fill",i<=st));
  $("#stepName").textContent = L.steps[Math.min(st,3)];
  $("#stepNum").textContent = L.step+" "+(Math.min(st,3)+1)+"/4";
  const n=S.services.length, p=totalPrice();
  $("#barTotal").textContent = n?priceStr(p):(st===0&&S.barber?barberLabel():"0 L");
  const info=[];
  if(st>0&&S.barber) info.push(S.barber==="any"?t("any"):BARBERS.find(b=>b.id===S.barber).name.split(" ")[0]);
  if(n) info.push(L.servicesN(n)+" · "+fmtDur(totalMin()));
  if(st>=2&&S.time!=null) info.push(fmtT(S.time));
  $("#barInfo").textContent = info.join(" · ") || (st===0?t("pickBarber"):"");
  const btn=$("#next");
  let ok=true,label=t("cont");
  if(st===0){ok=!!S.barber; if(!ok)label=t("choose")}
  if(st===1){ok=n>0; if(!ok)label=t("pickSvc")}
  if(st===2){ok=S.time!=null; if(!ok)label=t("pickTime")}
  if(st===3){label=t("book")}
  btn.disabled=!ok;
  btn.innerHTML = label + (ok?` <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`:"");
}

function render(){
  renderStatic();
  $$(".screen").forEach(s=>s.classList.toggle("on",+s.dataset.step===S.step));
  if(S.step===0) renderBarbers();
  if(S.step===1) renderServices();
  if(S.step===2) renderDates();
  if(S.step===3) renderDetails();
  if(S.step===4) renderDone();
  renderBar();
}

function go(step, push=true){
  S.step=step;
  if(push) history.pushState({step},"","#"+["barber","services","time","details","done"][step]);
  render(); window.scrollTo({top:0,behavior:"instant"});
}

/* ============================================================ EVENTS */
document.addEventListener("click",e=>{
  const el=e.target.closest("button,[data-jump]"); if(!el) return;
  if(el.dataset.lang){S.lang=el.dataset.lang;save();render();return}
  if(el.closest("#barbers")&&el.dataset.b){S.barber=el.dataset.b;S.time=null;save();renderBarbers();renderBar();
    if(navigator.vibrate)navigator.vibrate(8); return}
  if(el.dataset.c){S.cat=el.dataset.c;renderServices();return}
  if(el.id==="useCombo"){S.services=S.services.filter(x=>x!=="cut"&&x!=="beard");S.services.unshift("complex");S.time=null;save();renderServices();renderBar();toast("✓ "+t("toastSvc"));return}
  if(el.dataset.s){
    const id=el.dataset.s, svc=SERVICES.find(s=>s.id===id);
    if(S.services.includes(id)) S.services=S.services.filter(x=>x!==id);
    else{
      S.services.push(id);
      if(svc.includes) S.services=S.services.filter(x=>!svc.includes.includes(x));
      const parent=SERVICES.find(s=>s.includes&&s.includes.includes(id));
      if(parent) S.services=S.services.filter(x=>x!==parent.id);
    }
    S.time=null; save(); renderServices(); renderBar(); return}
  if(el.dataset.d){S.date=el.dataset.d;S.time=null;renderDates();renderBar();return}
  if(el.dataset.go){S.date=el.dataset.go;S.time=null;renderDates();renderBar();return}
  if(el.dataset.t){S.time=+el.dataset.t;S.assigned=el.dataset.b;$$(".slot").forEach(s=>s.classList.toggle("sel",s===el));renderBar();
    if(navigator.vibrate)navigator.vibrate(8); return}
  if(el.dataset.r!=null){S.reminder=+el.dataset.r;renderDetails();return}
  if(el.dataset.jump!=null){go(+el.dataset.jump);return}
  if(el.id==="back"){history.length>1&&location.hash?history.back():go(Math.max(0,S.step-1));return}
  if(el.id==="next"){next();return}
  if(el.id==="ics"){downloadICS();return}
  if(el.id==="again"){S.services=[];S.time=null;S.date=null;S.barber=null;save();go(0);return}
});
$("#consent").addEventListener("click",e=>{e.preventDefault();const c=$("#fConsent");c.checked=!c.checked;$("#consent").classList.toggle("sel",c.checked);$("#consent").classList.remove("err")});
$("#fPhone").addEventListener("input",e=>{
  let d=e.target.value.replace(/\D/g,"").replace(/^373/,"").replace(/^0/,"").slice(0,8);
  e.target.value=[d.slice(0,3),d.slice(3,5),d.slice(5,8)].filter(Boolean).join(" ");
  $("#phoneWrap").classList.remove("err");
});
["fName","fEmail"].forEach(id=>$("#"+id).addEventListener("input",e=>e.target.classList.remove("err")));
window.addEventListener("popstate",e=>{const s=e.state?.step??0; if(S.step===4&&s<4){go(0,false);return} go(s,false)});
window.addEventListener("scroll",()=>$("#top").classList.toggle("scrolled",scrollY>8),{passive:true});

function validate(){
  let ok=true;
  const n=$("#fName"), p=$("#fPhone"), m=$("#fEmail"), c=$("#fConsent");
  if(n.value.trim().length<2){n.classList.add("err");ok=false}
  if(p.value.replace(/\D/g,"").length!==8){$("#phoneWrap").classList.add("err");$("#phoneWrap").after($("#ePhone"));$("#ePhone").style.display="block";ok=false}else $("#ePhone").style.display="";
  if(m.value&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m.value)){m.classList.add("err");ok=false}
  if(!c.checked){$("#consent").classList.add("err");ok=false}
  if(!ok){const f=$(".err");f&&f.scrollIntoView({block:"center",behavior:"smooth"});if(navigator.vibrate)navigator.vibrate([20,40,20])}
  return ok;
}

async function next(){
  if(S.step<3){
    if(S.step===1){/* keep date if still valid */ if(S.date&&!slotsFor(new Date(S.date+"T00:00")).length) S.date=null}
    go(S.step+1); return;
  }
  if(!validate()) return;
  const btn=$("#next"); btn.classList.add("busy"); btn.innerHTML=`<span class="sp"></span> ${t("booking")}`;
  const payload={
    barber: S.barber==="any"?S.assigned:S.barber, services:S.services, date:S.date, time:fmtT(S.time),
    name:$("#fName").value.trim(), phone:"+373"+$("#fPhone").value.replace(/\D/g,""), email:$("#fEmail").value.trim(),
    comment:$("#fComment").value.trim(), reminder:["1h","3h","24h"][S.reminder], lang:S.lang
  };
  // TODO: replace with the real booking API (e.g. POST /api/bookings). Demo delay:
  console.log("BOOKING",payload);
  await new Promise(r=>setTimeout(r,900));
  btn.classList.remove("busy");
  S.code="LEO-"+Math.random().toString(36).slice(2,6).toUpperCase();
  S.name=payload.name;
  if(S.barber!=="any") S.assigned=S.barber;
  go(4);
}

function renderDone(){
  $("#doneTitle").textContent = t("doneTitle",{n:S.name||""});
  $("#ticket").innerHTML = summaryHTML(false) + `<div class="r" style="justify-content:space-between"><span class="k">${t("code")}</span><span class="code">${S.code}</span></div>`;
}

function downloadICS(){
  const [y,mo,d]=S.date.split("-").map(Number);
  const st=new Date(y,mo-1,d,0,S.time), en=new Date(st.getTime()+totalMin()*6e4);
  const f=x=>x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate())+"T"+pad(x.getHours())+pad(x.getMinutes())+"00";
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//LEO Barbershop//RO","BEGIN:VEVENT",
    "UID:"+S.code+"@leobarbershop","DTSTAMP:"+f(new Date()),"DTSTART:"+f(st),"DTEND:"+f(en),
    "SUMMARY:LEO Barbershop — "+selSvcs().map(svcName).join(", "),
    "LOCATION:"+SHOP.address.replace(/,/g,"\\,"),"DESCRIPTION:"+barberLabel(),
    "BEGIN:VALARM","TRIGGER:-PT"+[60,180,1440][S.reminder]+"M","ACTION:DISPLAY","DESCRIPTION:LEO Barbershop","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download="leo-barbershop.ics";a.click();
}

let tt;function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("on"),1800)}

/* start */
history.replaceState({step:0},"","#barber");
render();
</script>
</body>
</html>
